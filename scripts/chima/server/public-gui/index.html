<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHIMA Codex</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CHIMA runtime</p>
          <h1>Codex CHIMA v1</h1>
        </div>
        <div class="status-strip" aria-label="Runtime status">
          <span class="status-pill" data-state="idle" id="healthState">
            <span class="dot"></span>
            Health unknown
          </span>
          <span class="status-pill" data-state="idle" id="socketState">
            <span class="dot"></span>
            Socket idle
          </span>
        </div>
      </header>

      <section class="toolbar" aria-label="Controls">
        <button type="button" id="checkHealth">Check health</button>
        <button type="button" id="connectSocket">Connect</button>
        <button type="button" id="disconnectSocket" disabled>Disconnect</button>
      </section>

      <section class="grid" aria-label="Runtime overview">
        <article class="panel">
          <h2>Endpoint</h2>
          <dl>
            <div>
              <dt>Health</dt>
              <dd id="readyUrl">Pending</dd>
            </div>
            <div>
              <dt>WebSocket</dt>
              <dd id="wsUrl">Pending</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd>Staged public shell</dd>
            </div>
          </dl>
        </article>

        <article class="panel">
          <h2>Handshake</h2>
          <pre id="handshakeOutput">No connection yet.</pre>
        </article>
      </section>

      <section class="log-panel" aria-label="Activity">
        <div class="section-header">
          <h2>Activity</h2>
          <button type="button" class="secondary" id="clearLog">Clear</button>
        </div>
        <pre id="activityLog">Ready.</pre>
      </section>
    </main>

    <script src="./assets/app.js"></script>
  </body>
</html>
